paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  reports: reports
  figures: reports/figures
  models: models

dataset:
  name: ecommerce-clickstream
  months:
    - "2019-Oct"
    - "2019-Nov"
  file_pattern: "{month}.csv"
  raw_filename_template: "{month}.csv"
  url_template: ""
  rows_per_month: 10000
  seed: 42
  currency: "USD"
  event_types:
    - "view"
    - "cart"
    - "purchase"
  event_type_weights:
    - 0.82
    - 0.13
    - 0.05
  events_dir: "events_parquet"
  session_features_dir: "session_features"
  train_dir: "train"
  test_dir: "test"

features:
  numeric:
    - "total_events"
    - "num_views"
    - "num_carts"
    - "num_purchases"
    - "unique_products"
    - "unique_categories"
    - "session_duration_seconds"
    - "avg_price_viewed"
    - "max_price_viewed"
    - "hour_of_day"
    - "day_of_week"
    - "is_weekend"
  label: "purchase_in_session"
  features_col: "features"

leakage_columns:
  - "purchase_in_session"
  - "has_purchase"
  - "purchase_count"
  - "event_purchase_count"
  - "event_type_purchase"

split:
  method: "time"
  time_column: "session_date"
  train_ratio: 0.8
  seed: 42

training:
  max_iter: 50
  reg_param: 0.01
  elastic_net_param: 0.0

evaluation:
  threshold: 0.5

processing:
  overwrite: false
  smoke_row_limit: 2000000
  max_days_per_run: 7

spark:
  app_name: "clickstream-pipeline"
  master: "local[*]"
  shuffle_partitions: 64
  timezone: "UTC"
